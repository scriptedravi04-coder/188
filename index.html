<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // First script in head to catch and suppress any cross-origin script or iframe errors
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        if (msg === 'Script error.' || (typeof msg === 'string' && (msg.includes('ResizeObserver') || msg.includes('Script error')))) {
          return true;
        }
      };
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || event.message?.includes('ResizeObserver') || event.message?.includes('Script error')) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason?.message?.includes?.('ResizeObserver') || event.reason?.message?.includes?.('Script error')) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      });
    </script>
